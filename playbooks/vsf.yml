---
# VSF stacking for new switches joining an existing stack.
- name: Configure the VSF stack members
  hosts: aoscx
  gather_facts: false
  vars:
    ansible_connection: ansible.netcommon.network_cli
  tasks:
    - name: Declare the member and its links
      ansible.builtin.include_role:
        name: aoscx
        tasks_from: vsf
      when: vsf | default({}) | length > 0
