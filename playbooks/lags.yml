---
# Only applies to switches whose host_vars declares LAGs.
- name: Create the LAGs surveyed on site
  hosts: aoscx
  gather_facts: false
  tasks:
    - name: Create the LAGs and assign their VLANs
      ansible.builtin.include_role:
        name: aoscx
        tasks_from: lags
      when: lags | default([]) | length > 0
