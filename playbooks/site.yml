---
# Order of a full run: survey the current state first, then apply.
# Always run once with --check before applying.
- name: Survey the current state
  ansible.builtin.import_playbook: versions.yml

- name: Fleet VLANs
  ansible.builtin.import_playbook: vlans.yml

- name: LAGs
  ansible.builtin.import_playbook: lags.yml
