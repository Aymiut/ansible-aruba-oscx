---
# Connexion : les modules de la collection passent par l'API REST d'AOS-CX.
ansible_network_os: arubanetworks.aoscx.aoscx
ansible_connection: arubanetworks.aoscx.aoscx
ansible_httpapi_use_ssl: true
ansible_httpapi_validate_certs: false
ansible_user: "{{ oscx_user }}"
ansible_password: "{{ oscx_password }}"

# Identifiants par défaut du parc. Le lot le plus ancien utilise un autre
# compte : il est redéfini dans les host_vars des commutateurs concernés.
oscx_user: "{{ vault_oscx_user }}"
oscx_password: "{{ vault_oscx_password }}"

# VLAN propagés sur l'ensemble du parc. Ajouter une ligne ici suffit : le
# playbook les crée partout et ne touche à rien d'autre.
vlans:
  - id: 10
    name: ADMINISTRATION
  - id: 20
    name: SOINS
  - id: 30
    name: IMAGERIE
  - id: 40
    name: BIOMEDICAL
  - id: 50
    name: WIFI-PERSONNEL
  - id: 60
    name: WIFI-INVITES
  - id: 70
    name: TELEPHONIE
  - id: 90
    name: MANAGEMENT
  - id: 300
    name: UPLINK

# Version logicielle attendue sur tout le parc. Le playbook `versions.yml`
# relève la version réelle de chaque commutateur et liste les écarts.
firmware_expected: "10.10.1020"
