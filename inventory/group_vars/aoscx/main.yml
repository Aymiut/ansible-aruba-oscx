---
# Connection: the collection's modules go through the AOS-CX REST API.
ansible_network_os: arubanetworks.aoscx.aoscx
ansible_connection: arubanetworks.aoscx.aoscx
ansible_httpapi_use_ssl: true
ansible_httpapi_validate_certs: false
ansible_user: "{{ oscx_user }}"
ansible_password: "{{ oscx_password }}"

# Default credentials for the fleet. The oldest batch uses a different
# account: it is overridden in the host_vars of the switches concerned.
oscx_user: "{{ vault_oscx_user }}"
oscx_password: "{{ vault_oscx_password }}"

# VLANs propagated across the whole fleet. Adding a line here is enough: the
# playbook creates them everywhere and touches nothing else.
vlans:
  - id: 10
    name: ADMINISTRATION
  - id: 20
    name: CLINICAL
  - id: 30
    name: IMAGING
  - id: 40
    name: BIOMEDICAL
  - id: 50
    name: WIFI-STAFF
  - id: 60
    name: WIFI-GUEST
  - id: 70
    name: VOICE
  - id: 90
    name: MANAGEMENT
  - id: 300
    name: UPLINK

# Expected software version across the fleet. The `versions.yml` playbook
# collects the actual version of each switch and lists the mismatches.
firmware_expected: "10.10.1020"
