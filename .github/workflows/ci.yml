---
name: CI

on: [push, pull_request]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ansible and the collection
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core
          ansible-galaxy collection install -r requirements.yml

      - name: Lint YAML files
        run: |
          pip install yamllint
          yamllint .

      - name: Check the inventory
        run: ansible-inventory -i inventory/hosts.yml --list > /dev/null

      - name: Check playbook syntax
        run: |
          for p in playbooks/*.yml; do
            ansible-playbook -i inventory/hosts.yml --syntax-check "$p"
          done

      - name: Test the LAG guard
        run: ansible-playbook tests/stack-member-guard.yml
