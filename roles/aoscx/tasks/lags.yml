---
# In a stack, a port ID is written member/module/port. Targeting the wrong
# member means reconfiguring a switch that is already in production, so we
# refuse to apply if a port doesn't match the declared member.
- name: Check that each port belongs to the declared stack member
  ansible.builtin.assert:
    that:
      - item.1.split('/')[0] | int == item.0.member
    fail_msg: >-
      {{ item.1 }} is not on stack member {{ item.0.member }}
      ({{ inventory_hostname }}). Fix the host_vars before applying.
    quiet: true
  loop: "{{ lags | subelements('interfaces') }}"
  loop_control:
    label: "lag{{ item.0.id }} {{ item.1 }}"

# Ports on an Aruba switch are administratively down by default.
# Without this task, the LAG gets created but never comes up.
- name: Enable the LAG member ports
  arubanetworks.aoscx.aoscx_interface:
    name: "{{ item.1 }}"
    description: "Member of lag{{ item.0.id }}"
    enabled: true
  loop: "{{ lags | subelements('interfaces') }}"
  loop_control:
    label: "{{ item.1 }}"

- name: Create the LACP LAGs
  arubanetworks.aoscx.aoscx_lag_interface:
    name: "lag{{ item.id }}"
    interfaces: "{{ item.interfaces }}"
    lacp_mode: active
    state: create
  loop: "{{ lags }}"
  loop_control:
    label: "lag{{ item.id }} {{ item.description }}"

- name: Assign the VLANs to the LAGs
  arubanetworks.aoscx.aoscx_l2_interface:
    interface: "lag{{ item.id }}"
    vlan_mode: trunk
    native_vlan_id: "{{ item.native_vlan | string }}"
    vlan_trunks: "{{ item.tagged_vlans }}"
  loop: "{{ lags }}"
  loop_control:
    label: "lag{{ item.id }}"

- name: Enable the LAGs
  arubanetworks.aoscx.aoscx_interface:
    name: "lag{{ item.id }}"
    description: "{{ item.description }}"
    enabled: true
  loop: "{{ lags }}"
  loop_control:
    label: "lag{{ item.id }}"
