---
- name: Collect the software version
  arubanetworks.aoscx.aoscx_facts:
    gather_subset:
      - software_version
      - platform_name
      - host_name

- name: Show the version and any mismatch with the expected version
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }} ({{ ansible_net_platform_name | default('unknown model') }}):
      {{ ansible_net_software_version | default('unknown version') }}
      {{ '— OK' if ansible_net_software_version | default('') == firmware_expected
         else '— EXPECTED ' ~ firmware_expected }}
