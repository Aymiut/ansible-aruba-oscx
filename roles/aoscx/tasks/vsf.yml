---
# There is no module for VSF stacking: it has to go through the CLI.
# This part could not be tested in simulation because the EVE-NG images don't
# support stacking; it was written before the on-site intervention.
- name: Declare the stack member and its VSF links
  arubanetworks.aoscx.aoscx_config:
    lines:
      - "link 1 {{ vsf.link_interfaces | join(',') }}"
    parents:
      - "vsf member {{ vsf.member }}"
    save_when: modified
  when: vsf | length > 0
