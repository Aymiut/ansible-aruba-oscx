---
# Hardware-free test of the LAG guard: the role must reject a port that
# doesn't belong to the declared stack member. This is exactly the mistake
# that, in production, overwrote the configuration of switches already in
# service.
- name: Stack member number guard
  hosts: localhost
  gather_facts: false
  vars:
    valid:
      - id: 11
        member: 2
        interfaces: ["2/1/11", "2/1/12"]
    invalid:
      - id: 11
        member: 2
        interfaces: ["1/1/11", "2/1/12"]
  tasks:
    - name: A correct declaration passes
      ansible.builtin.assert:
        that:
          - item.1.split('/')[0] | int == item.0.member
        quiet: true
      loop: "{{ valid | subelements('interfaces') }}"
      loop_control:
        label: "{{ item.1 }}"

    - name: An incorrect declaration is rejected
      block:
        - name: Check the ports
          ansible.builtin.assert:
            that:
              - item.1.split('/')[0] | int == item.0.member
            quiet: true
          loop: "{{ invalid | subelements('interfaces') }}"
          loop_control:
            label: "{{ item.1 }}"

        - name: The test fails if the guard lets it through
          ansible.builtin.fail:
            msg: "Port 1/1/11 should have been rejected for member 2."
      rescue:
        - name: Rejection confirmed
          ansible.builtin.debug:
            msg: "The guard blocked the port on the wrong stack member."
